name: Build, Package, Release (newworkflow-test.yaml)
description: Build and release a Docker image for AMD64 architecture without semantic release.
'on':
  release:
    types:
      - created
  push:
    branches:
      - dev
env:
  VERSION: 0.0.1
  MO_DOCKERFILE: Dockerfile
  MO_DOCKERCONTEXT: .
  MO_REGISTRY_AUTH_URL: https://ghcr.io
  MO_REGISTRY_URL: ghcr.io/janlepsky
  MO_IMAGE_NAME: pipeline-image
  MO_API_KIND: workspace
  MO_API_TOKEN_EXPIRES_AT__BE605F893F0C8769ABDC: '2026-09-08T07:20:53.000Z'
  MO_SERVICE__BE605F893F0C8769ABDC: H4sIAAAAAAAAA22Nu27EIBQF/+XURsEY/KDeJk3K9NfmOkJrAwKcKFntv0feSFGKtKMzc26I+Y2C/6LqY3h2sOgGPbA0rXCTkULrXopppElIPXPXm3amdUWDZTtK5fxQnJJqkGsnVG+M0EsrxdhOTrBWivXsVDeNaPAR87UkWviFdoZFZdpliwaZSzzywrA3XH04kxdOW/zcOVQ0SNuRaTuPfmlBA0r+lXPxMcCCUipP72ct0M6PGwdb88H3HwSL5BNvPrAolXLlLCilv8J/k8ql4v4NLQSkyigBAAA=
jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: get semversion
        run: |
          VERSION=$(git describe --tags $(git rev-list --tags --max-count=1))
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Get last commit hash
        id: lastHash
        run: |
          LAST_HASH=$(git rev-parse --short HEAD)
          echo "LAST_HASH=$LAST_HASH" >> $GITHUB_ENV
      - id: containerRegistryLogin
        name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.MO_REGISTRY_AUTH_URL }}
          username: ${{ secrets.MO_REGISTRY_USER__NEWWORKFLOW_TEST }}
          password: ${{ secrets.MO_REGISTRY_PAT__NEWWORKFLOW_TEST }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push amd64 image
        id: buildAndPushImage
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.MO_DOCKERCONTEXT }}
          file: ${{ env.MO_DOCKERFILE }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.MO_REGISTRY_URL }}/${{ env.MO_IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.MO_REGISTRY_URL }}/${{ env.MO_IMAGE_NAME }}:latest
            ${{ env.MO_REGISTRY_URL }}/${{ env.MO_IMAGE_NAME }}:${{ env.LAST_HASH }}
          build-args: ''
      - id: releaseWithMogenius-BE605F893F0C8769ABDC
        name: Release with mogenius
        uses: mogenius/mogenius-release-action@v1
        with:
          dev: false
          image: ${{ env.MO_REGISTRY_URL }}/${{ env.MO_IMAGE_NAME }}:${{ env.VERSION }}
          kind: Deployment
          namespace: pipeline-starter-test
          resourceName: pipeline-starter-app
          containerName: pipeline-starter-app
          keyKind: ${{ env.MO_API_KIND }}
          token: bearer ${{ secrets.MO_API_TOKEN__BE605F893F0C8769ABDC__NEWWORKFLOW_TEST }}
